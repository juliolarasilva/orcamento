<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento Familiar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--acc:#0f766e;--acc2:#0d9488;--red:#dc2626;--green:#16a34a;--amber:#d97706;--soft:#f0fdfa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--acc);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:600}
header .sub{font-size:12px;opacity:.85}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500}
nav button:hover{background:rgba(255,255,255,.25)}
nav button.on{background:#fff;color:var(--acc);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:12px;color:var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f8fafc;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0;z-index:2}
td.l,th.l{text-align:left}
tr.grp td{background:#eef2f6;font-weight:700}
tr.item td:first-child{padding-left:22px}
tr.total td{background:var(--soft);font-weight:700;border-top:2px solid var(--acc)}
.tblwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--mut)}
input,select{border:1px solid #cbd5e1;border-radius:7px;padding:6px 8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc2);border-color:var(--acc2)}
input.num{width:92px;text-align:right;border:1px solid transparent;background:transparent;padding:4px 6px}
input.num:hover{border-color:#cbd5e1}
input.num:focus{background:#fff}
button.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--acc2)}
button.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
button.btn.ghost{background:#f1f5f9;color:var(--ink);border:1px solid var(--line)}
button.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
button.mini{background:none;border:none;cursor:pointer;font-size:13px;color:var(--mut);padding:2px 5px;border-radius:5px}
button.mini:hover{background:#eef2f6;color:var(--ink)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag.ok{background:#dcfce7;color:#166534}.tag.warn{background:#fef3c7;color:#92400e}.tag.info{background:#e0f2fe;color:#075985}
.drop{border:2px dashed #94a3b8;border-radius:12px;padding:28px;text-align:center;color:var(--mut);cursor:pointer;background:#fafcfd}
.drop.over{border-color:var(--acc);background:var(--soft)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:1080px;width:100%;max-height:92vh;overflow:auto}
.modal h3{margin-bottom:12px;color:var(--acc)}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;right:22px;background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.flex1{flex:1}
.fonte-pill{font-size:11px;color:var(--mut)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.li-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.muted-sm{font-size:12px;color:var(--mut)}
@media(max-width:760px){input.num{width:74px}main{padding:10px}}
</style>
</head>
<body>
<header>
  <div><h1>💰 Orçamento Familiar</h1><div class="sub"><span id="hdrSub">—</span> <span id="driveStatus" style="cursor:pointer" title="Clique para sincronizar"></span></div></div>
  <nav>
    <button data-tab="painel" class="on">Painel</button>
    <button data-tab="lancar">Anotações</button>
    <button data-tab="orcamento">Orçamento</button>
    <button data-tab="importacao">Importação</button>
    <button data-tab="realizado">Realizado</button>
    <button data-tab="realanual">Real Anual</button>
    <button data-tab="config">Configurações</button>
  </nav>
</header>
<main>
  <div id="tab-painel"></div>
  <div id="tab-lancar" class="hide"></div>
  <div id="tab-orcamento" class="hide"></div>
  <div id="tab-importacao" class="hide"></div>
  <div id="tab-realizado" class="hide"></div>
  <div id="tab-realanual" class="hide"></div>
  <div id="tab-config" class="hide"></div>
</main>
<div id="modalBg" class="modal-bg hide"><div class="modal" id="modalBox"></div></div>
<input type="file" id="fileInput" multiple accept=".ofx,.csv,.txt,.pdf,.xls" class="hide">
<input type="file" id="fileRealizado" accept=".csv,.txt" class="hide">
<script>
'use strict';
/* ================= DADOS / ESTADO ================= */
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_FULL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SEED_CATS=(()=>{const d=[
 ['Receitas','receita',['Adiantamento Marcelo','Salário Marcelo','Férias Marcelo','13° Marcelo','Entradas Daiane','Rendimento Aplicações','Cursos Extras','Restituição IR Marcelo','Outras Entradas']],
 ['Dízimo e Oferta','despesa',['Dízimo e Oferta']],
 ['Moradia','despesa',['Financiamento Imobiliário','Condomínio','Manutenção / Reforma','Água','Energia Elétrica','Gás','IPTU','Outros Moradia']],
 ['Comunicações','despesa',['Telefone Fixo','Telefone Celular','Streaming','Internet','Outros Comunicação']],
 ['Alimentação','despesa',['Supermercado','Restaurantes','Padaria','Feira/Varejão','Outras Alimentação']],
 ['Transporte','despesa',['Combustível','Manutenção Veículo','Lavagem','Estacionamento','Pedágio','Uber','Outros Transportes']],
 ['Saúde','despesa',['Plano de Saúde','Remédios','Aula Bateria','Aula Piano','Academia','Outros Saúde']],
 ['Educação','despesa',['Mensalidades','Alimentação Escolar','Material Escolar','Condução','Inglês','Espanhol','Outras Educação']],
 ['Lazer','despesa',['Viagens','Acampamento','Cinema','Festas/Churrascos','Livros','Alimentação Marcelo','Outros Lazer']],
 ['Pessoais','despesa',['Vestuário','Calçados','Cabelereiro','Presentes','Salão Beleza','Tito','Outras Pessoais']],
 ['Compras','despesa',['Decoração','Eletrodomésticos','Móveis','Outras Compras']],
 ['Seguros','despesa',['Seguro do Carro','Seguro da Casa','Seguro Viagem','Seguro de Vida']],
 ['Impostos','despesa',['Impostos']],
 ['Financiamentos e Bancos','despesa',['Despesas Bancárias','Juros Bancários','CDC Caixa','Cartão Caixa Elo','Cartão Brasil','Cartão Bradesco','Empréstimos Bancários','Empréstimos com Pessoas','Outras Financeiras']],
 ['Investimentos','despesa',['Investimentos']],
 ['Transferências','transferencia',['Transferência entre contas','Pagamento de Fatura']]
];const out=[];d.forEach(([g,t,items])=>items.forEach(n=>out.push({grupo:g,nome:n,tipo:t})));return out;})();
const SEED_CONTAS=['Conta Itaú','Conta Caixa','Conta Bradesco','Conta Brasil','Conta Santander','Cartão Caixa Elo','Cartão Brasil','Cartão Bradesco'];
const DRIVE_CLIENT_ID_PADRAO='1049391432426-0dal4ekc3lh9h67dg9s43972l949cbd4.apps.googleusercontent.com';
const ANO_ATUAL=new Date().getFullYear();
let state=null;
function novoEstado(){return {versao:1,familia:'Família Guerreiro',ano:ANO_ATUAL,mes:new Date().getMonth(),categorias:JSON.parse(JSON.stringify(SEED_CATS)),contas:[...SEED_CONTAS],orcamento:{},transacoes:[],regras:{},ultimaFonte:'',driveClientId:DRIVE_CLIENT_ID_PADRAO,anotacoes:[],saldos:{}};}
function salvar(){try{localStorage.setItem('orcFamiliar',JSON.stringify(state));}catch(e){console.warn(e);}salvarTimestamp();driveAgendarSalvar();}
function salvarTimestamp(){const el=document.getElementById('hdrSub');if(el)el.textContent=state.familia+' · salvo neste navegador';}
function carregar(){try{const s=localStorage.getItem('orcFamiliar');if(s){state=JSON.parse(s);if(!state.regras)state.regras={};if(state.ultimaFonte===undefined)state.ultimaFonte='';if(!state.driveClientId)state.driveClientId=DRIVE_CLIENT_ID_PADRAO;if(!state.anotacoes)state.anotacoes=[];if(!state.saldos)state.saldos={};return;}}catch(e){}state=novoEstado();}
/* ================= UTILS ================= */
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=v=>fmtBRL.format(v||0);
const fmtK=v=>fmtBRL.format(v||0).replace(/,\d\d$/,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const normDesc=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\d+/g,'').replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
const parseValorBR=s=>{if(typeof s==='number')return s;s=String(s||'').trim().replace(/R\$\s?/,'');const neg=/^-|^\(.*\)$/.test(s);s=s.replace(/[()\-+]/g,'');if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const v=parseFloat(s);return isNaN(v)?null:(neg?-v:v);};
function parseDataBR(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return s.slice(0,10);m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let[,d,mo,y]=m;if(y.length===2)y='20'+y;return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;}return null;}
const compDe=d=>d?d.slice(0,7):null;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function catPorNome(n){return state.categorias.find(c=>c.nome===n);}
function grupos(){const ordem=[];const map={};state.categorias.forEach(c=>{if(!map[c.grupo]){map[c.grupo]={nome:c.grupo,tipo:c.tipo,itens:[]};ordem.push(map[c.grupo]);}map[c.grupo].itens.push(c);});return ordem;}
function orcGet(ano,cat){const a=state.orcamento[ano];if(!a||!a[cat])return Array(12).fill(0);return a[cat];}
function orcSet(ano,cat,mes,val){if(!state.orcamento[ano])state.orcamento[ano]={};if(!state.orcamento[ano][cat])state.orcamento[ano][cat]=Array(12).fill(0);state.orcamento[ano][cat][mes]=val;}
function realPorCatMes(ano){const out={};state.transacoes.forEach(t=>{if(!t.comp)return;const[y,m]=t.comp.split('-').map(Number);if(y!==ano)return;const cat=t.categoria||'__sem__';if(!out[cat])out[cat]=Array(12).fill(0);out[cat][m-1]+=t.valor;});return out;}
/* ================= NAVEGAÇÃO ================= */
const TABS={painel:renderPainel,lancar:renderLancar,orcamento:renderOrcamento,importacao:renderImportacao,realizado:renderRealizado,realanual:renderRealAnual,config:renderConfig};
let tabAtiva='painel';
function irParaAba(nome){tabAtiva=nome;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===nome));Object.keys(TABS).forEach(k=>document.getElementById('tab-'+k).classList.toggle('hide',k!==nome));TABS[nome]();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>irParaAba(b.dataset.tab));
function rerender(){salvar();TABS[tabAtiva]();}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalBg').classList.remove('hide');}
function fecharModal(){document.getElementById('modalBg').classList.add('hide');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')fecharModal();});
/* ================= CHECK DE SALDO ================= */
function contasCorrentes(){return state.contas.filter(c=>!/cart/i.test(c));}
function saldoGet(comp,conta){return (state.saldos&&state.saldos[comp])?state.saldos[comp][conta]:undefined;}
function saldoSet(comp,conta,v){if(!state.saldos)state.saldos={};if(!state.saldos[comp])state.saldos[comp]={};if(v===null||v===undefined)delete state.saldos[comp][conta];else state.saldos[comp][conta]=v;}
function movimentoContas(comp){
 const ccs=contasCorrentes();let e=0,s=0;
 state.transacoes.forEach(t=>{
  if(!t.data||t.data.slice(0,7)!==comp)return;
  if(!ccs.includes(t.fonte))return;
  if(t.tipo==='receita')e+=t.valor;else s+=t.valor;});
 return {e,s};
}
/* ================= PAINEL (REAL x ORÇADO) ================= */
function renderPainel(){
 const ano=state.ano,mes=state.mes,real=realPorCatMes(ano);
 const sum=(arr,a,b)=>arr.slice(a,b).reduce((x,y)=>x+y,0);
 const tot={recR:0,recO:0,despR:0,despO:0,recRA:0,recOA:0,despRA:0,despOA:0};
 grupos().forEach(g=>{if(g.tipo==='transferencia')return;g.itens.forEach(c=>{
  const r=real[c.nome]||Array(12).fill(0),o=orcGet(ano,c.nome);
  const rm=r[mes],om=o[mes],ra=sum(r,0,mes+1),oa=sum(o,0,mes+1);
  if(g.tipo==='receita'){tot.recR+=rm;tot.recO+=om;tot.recRA+=ra;tot.recOA+=oa;}
  else{tot.despR+=rm;tot.despO+=om;tot.despRA+=ra;tot.despOA+=oa;}});});
 const semCat=state.transacoes.filter(t=>!t.categoria&&t.comp&&t.comp.startsWith(ano+'-')).length;
 const saldoR=tot.recR-tot.despR,saldoO=tot.recO-tot.despO,saldoRA=tot.recRA-tot.despRA,saldoOA=tot.recOA-tot.despOA;
 let h=`<div class="card"><div class="row">
  <label><b>Mês:</b> <select id="pMes">${MESES_FULL.map((m,i)=>`<option value="${i}" ${i===mes?'selected':''}>${m}</option>`).join('')}</select></label>
  <label><b>Ano:</b> <select id="pAno">${anosDisponiveis().map(a=>`<option ${a===ano?'selected':''}>${a}</option>`).join('')}</select></label>
  ${semCat?`<span class="tag warn" id="pSemCat" style="cursor:pointer" title="Ir para a Importação">⚠ ${semCat} lançamento(s) a classificar em ${ano} — clique para classificar</span>`:'<span class="tag ok">✓ Tudo categorizado</span>'}
 </div></div>
 <div class="cards">
  ${kpi('Receitas no mês',tot.recR,tot.recO,'rec')}
  ${kpi('Despesas no mês',tot.despR,tot.despO,'desp')}
  ${kpi('Saldo no mês',saldoR,saldoO,'saldo')}
  ${kpi('Saldo acumulado',saldoRA,saldoOA,'saldo')}
 </div>
 <div class="tblwrap"><table><thead><tr><th class="l">Categoria</th>
  <th>Real ${MESES[mes]}</th><th>Orçado</th><th>Var</th><th>Var %</th>
  <th style="border-left:2px solid var(--line)">Real Acum.</th><th>Orçado Acum.</th><th>Var</th><th>Var %</th></tr></thead><tbody>`;
 grupos().forEach(g=>{if(g.tipo==='transferencia')return;
  let gr=[0,0,0,0];const linhas=[];
  g.itens.forEach(c=>{const r=real[c.nome]||Array(12).fill(0),o=orcGet(ano,c.nome);
   const rm=r[mes],om=o[mes],ra=sum(r,0,mes+1),oa=sum(o,0,mes+1);
   gr[0]+=rm;gr[1]+=om;gr[2]+=ra;gr[3]+=oa;
   if(rm||om||ra||oa)linhas.push(`<tr class="item"><td class="l">${esc(c.nome)}</td>${celulas(rm,om,g.tipo)}${celulas(ra,oa,g.tipo,true)}</tr>`);});
  if(gr.some(v=>v))h+=`<tr class="grp"><td class="l">${esc(g.nome)}</td>${celulas(gr[0],gr[1],g.tipo)}${celulas(gr[2],gr[3],g.tipo,true)}</tr>`+linhas.join('');});
 const semCatVals=real['__sem__'];
 if(semCatVals){const rm=semCatVals[mes],ra=sum(semCatVals,0,mes+1);
  if(rm||ra)h+=`<tr class="grp"><td class="l" style="color:var(--amber)">⚠ Sem categoria</td><td>${fmt(rm)}</td><td>—</td><td>—</td><td>—</td><td style="border-left:2px solid var(--line)">${fmt(ra)}</td><td>—</td><td>—</td><td>—</td></tr>`;}
 h+=`<tr class="total"><td class="l">SALDO (Receitas − Despesas)</td>${celulas(saldoR,saldoO,'receita')}${celulas(saldoRA,saldoOA,'receita',true)}</tr>`;
 h+='</tbody></table></div>';
 // ---- Check de saldo das contas ----
 const mm2=String(mes+1).padStart(2,'0'),comp=`${ano}-${mm2}`;
 const compAnt=mes===0?`${ano-1}-12`:`${ano}-${String(mes).padStart(2,'0')}`;
 const nomeAnt=mes===0?`Dez/${ano-1}`:`${MESES[mes-1]}/${ano}`;
 const ccs=contasCorrentes();
 let totAnt=0,totAtu=0,faltaAnt=0,faltaAtu=0;
 const linhasS=ccs.map(c=>{
  const va=saldoGet(compAnt,c),vb=saldoGet(comp,c);
  if(va==null)faltaAnt++;else totAnt+=va;
  if(vb==null)faltaAtu++;else totAtu+=vb;
  return `<tr><td class="l">${esc(c)}</td>
   <td><input class="num" style="width:120px" data-sldant="${esc(c)}" value="${va!=null?String(va.toFixed(2)).replace('.',','):''}" placeholder="—"></td>
   <td><input class="num" style="width:120px" data-sldatu="${esc(c)}" value="${vb!=null?String(vb.toFixed(2)).replace('.',','):''}" placeholder="—"></td></tr>`;}).join('');
 const mov=movimentoContas(comp);
 const esperado=totAnt+mov.e-mov.s;
 const dif=totAtu-esperado;
 const completo=!faltaAnt&&!faltaAtu&&ccs.length>0;
 const fecha=Math.abs(dif)<0.01;
 let statusS;
 if(!completo)statusS=`<span class="tag warn">⚠ informe os saldos${faltaAnt?' de '+nomeAnt:''}${faltaAnt&&faltaAtu?' e':''}${faltaAtu?' de '+MESES[mes]+'/'+ano:''}</span>`;
 else statusS=fecha?'<span class="tag ok">✓ Conciliação fecha</span>':`<span class="tag warn">⚠ Diferença de ${fmt(dif)} — confira lançamentos faltantes ou saldos digitados</span>`;
 h+=`<div class="card"><h2>🏦 Check de saldo das contas — ${MESES_FULL[mes]}/${ano}</h2>
  <p class="muted-sm" style="margin-bottom:10px">Informe o saldo de fim de mês de cada conta corrente (cartões ficam fora — a fatura entra como saída via "Pagamento de Fatura"). Validação: saldo de ${nomeAnt} + entradas − saídas do mês = saldo atual.</p>
  <div class="row" style="align-items:flex-start;gap:24px;flex-wrap:wrap">
  <table style="max-width:430px"><thead><tr><th class="l">Conta</th><th>Fim ${nomeAnt}</th><th>Fim ${MESES[mes]}/${ano}</th></tr></thead><tbody>
   ${linhasS}
   <tr class="total"><td class="l">Total</td><td>${faltaAnt?'<span class="mut">incompleto</span>':fmt(totAnt)}</td><td>${faltaAtu?'<span class="mut">incompleto</span>':fmt(totAtu)}</td></tr>
  </tbody></table>
  <div style="min-width:240px">
   <div class="li-row"><span class="flex1">Saldo anterior (${nomeAnt})</span><b>${fmt(totAnt)}</b></div>
   <div class="li-row"><span class="flex1">+ Entradas nas contas</span><b class="pos">${fmt(mov.e)}</b></div>
   <div class="li-row"><span class="flex1">− Saídas das contas</span><b class="neg">${fmt(mov.s)}</b></div>
   <div class="li-row"><span class="flex1">= Saldo esperado</span><b>${fmt(esperado)}</b></div>
   <div class="li-row"><span class="flex1">Saldo informado</span><b>${fmt(totAtu)}</b></div>
   <div style="margin-top:8px">${statusS}</div>
  </div></div></div>`;
 const el=document.getElementById('tab-painel');el.innerHTML=h;
 el.querySelectorAll('input[data-sldant]').forEach(i=>{i.onchange=()=>{const v=parseValorBR(i.value);saldoSet(compAnt,i.dataset.sldant,i.value.trim()===''?null:v);rerender();};});

async function processarArquivos(files){
 let todas=[];
 for(const f of files){
  try{
   const ext=f.name.split('.').pop().toLowerCase();
   let regs=[];
   if(ext==='ofx'||ext==='txt')regs=parseOFX(await lerTexto(f));
   else if(ext==='csv')regs=await parseCSVInterativo(f);
   else if(ext==='pdf')regs=await parsePDF(f);
   else{toast('Formato não suportado: '+f.name);continue;}
   regs.forEach(r=>r.arquivo=f.name);
   todas=todas.concat(regs);
  }catch(err){console.error(err);toast('Erro ao ler '+f.name+': '+err.message);}
 }
 if(todas.length)modalPreview(todas);
 else toast('Nenhum lançamento encontrado nos arquivos.');
}
function lerTexto(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{
 const buf=new Uint8Array(r.result);
 let txt=new TextDecoder('utf-8',{fatal:false}).decode(buf);
 if((txt.match(/�/g)||[]).length>2)txt=new TextDecoder('windows-1252').decode(buf);
 res(txt);};r.onerror=rej;r.readAsArrayBuffer(f);});}
function parseOFX(txt){
 const regs=[];
 const blocos=txt.match(/<STMTTRN>[\s\S]*?(?=<\/STMTTRN>|<STMTTRN>|$)/gi)||[];
 const campo=(b,tag)=>{const m=b.match(new RegExp('<'+tag+'>([^<\\r\\n]*)','i'));return m?m[1].trim():null;};
 blocos.forEach(b=>{
  const dt=campo(b,'DTPOSTED'),amt=campo(b,'TRNAMT');
  const desc=campo(b,'MEMO')||campo(b,'NAME')||'(sem descrição)';
  if(!dt||!amt)return;
  const data=`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`;
  let v=parseFloat(String(amt).replace(',','.'));
  if(isNaN(v)||v===0)return;
  regs.push({data,descricao:desc,valor:Math.abs(v),tipo:v<0?'despesa':'receita'});
 });
 return regs;}
function parseCSVlinhas(txt){
 const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
 const linhas=[];let cur=[],campoAtual='',dentro=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(ch==='"'){if(dentro&&txt[i+1]==='"'){campoAtual+='"';i++;}else dentro=!dentro;}
  else if(ch===sep&&!dentro){cur.push(campoAtual);campoAtual='';}
  else if((ch==='\n'||ch==='\r')&&!dentro){if(campoAtual!==''||cur.length){cur.push(campoAtual);linhas.push(cur);cur=[];campoAtual='';}}
  else campoAtual+=ch;}
 if(campoAtual!==''||cur.length){cur.push(campoAtual);linhas.push(cur);}
 return linhas.filter(l=>l.some(c=>c.trim()!==''));}
function parseCSVInterativo(f){

  const linhas=parseCSVlinhas(await lerTexto(f));
  if(linhas.length<2){toast('CSV vazio: '+f.name);return res([]);}
  // detecta automaticamente colunas de data, valor e descrição
  const nCols=Math.max(...linhas.map(l=>l.length));
  const amostra=linhas.slice(0,Math.min(linhas.length,30));
  const scoreData=[],scoreVal=[];
  for(let c=0;c<nCols;c++){let d=0,v=0;amostra.forEach(l=>{const cell=(l[c]||'').trim();if(parseDataBR(cell))d++;const pv=parseValorBR(cell);if(pv!==null&&/\d/.test(cell)&&!parseDataBR(cell))v++;});scoreData[c]=d;scoreVal[c]=v;}
  const colData=scoreData.indexOf(Math.max(...scoreData));
  let colVal=-1,best=-1;for(let c=0;c<nCols;c++){if(c!==colData&&scoreVal[c]>best){best=scoreVal[c];colVal=c;}}
  // descrição: coluna de texto mais longa
  let colDesc=-1,bestLen=-1;for(let c=0;c<nCols;c++){if(c===colData||c===colVal)continue;const len=amostra.reduce((s,l)=>s+((l[c]||'').replace(/[\d.,\/\-]/g,'').trim().length),0);if(len>bestLen){bestLen=len;colDesc=c;}}
  const opts=n=>Array.from({length:nCols},(_,i)=>`<option value="${i}" ${i===n?'selected':''}>Coluna ${i+1}: ${esc((linhas[0][i]||'').slice(0,22))}</option>`).join('');
  modal(`<h3>Mapear colunas do CSV — ${esc(f.name)}</h3>

    <label><input type="checkbox" id="cHead" checked> 1ª linha é cabeçalho</label></div>
   <div class="tblwrap" style="max-height:300px"><table><tbody>${linhas.slice(0,8).map(l=>'<tr>'+Array.from({length:nCols},(_,i)=>`<td class="l">${esc((l[i]||'').slice(0,28))}</td>`).join('')+'</tr>').join('')}</tbody></table></div>
   <div class="row" style="margin-top:14px"><button class="btn" id="cOk">Continuar</button><button class="btn ghost" id="cCancel">Cancelar</button></div>`);
  document.getElementById('cCancel').onclick=()=>{fecharModal();res([]);};
  document.getElementById('cOk').onclick=()=>{
   const cd=+document.getElementById('cData').value,cde=+document.getElementById('cDesc').value,cv=+document.getElementById('cVal').value;
   const inicio=document.getElementById('cHead').checked?1:0;
   const regs=[];
   linhas.slice(inicio).forEach(l=>{
    const data=parseDataBR(l[cd]),v=parseValorBR(l[cv]);
    if(!data||v===null||v===0)return;
    regs.push({data,descricao:(l[cde]||'(sem descrição)').trim(),valor:Math.abs(v),tipo:v<0?'despesa':'receita'});});
   fecharModal();res(regs);};});}
async function parsePDF(f){
 if(typeof pdfjsLib==='undefined')throw new Error('Leitor de PDF indisponível (precisa de internet na 1ª vez).');
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const buf=await f.arrayBuffer();
 const doc=await pdfjsLib.getDocument({data:buf}).promise;
 const linhas=[];
 for(let p=1;p<=doc.numPages;p++){
  const page=await doc.getPage(p);
  const tc=await page.getTextContent();
  const items=tc.items.map(it=>({x:it.transform[4],y:it.transform[5],s:it.str})).filter(i=>i.s.trim()!=='');
  extrairLinhasColunas(items).forEach(l=>linhas.push(l));
 }
 return parseLinhasFatura(linhas);
}
/* Faturas como a do Itaú têm 2 colunas de lançamentos por página.
   Detecta as colunas pelos x das linhas que começam com data dd/mm
   e lê cada coluna por inteiro, na ordem, antes da próxima. */
function extrairLinhasColunas(items){
 const xs=items.filter(i=>/^\d{2}\/\d{2}/.test(i.s.trim())).map(i=>Math.round(i.x)).sort((a,b)=>a-b);
 const clusters=[];
 xs.forEach(x=>{const c=clusters[clusters.length-1];if(c&&x-c.max<=60){c.max=x;c.n++;}else clusters.push({min:x,max:x,n:1});});
 const fortes=clusters.filter(c=>c.n>=Math.max(3,Math.ceil(xs.length*0.25)));
 let bounds=[Infinity];
 if(fortes.length>=2){bounds=[];for(let i=1;i<fortes.length;i++)bounds.push(fortes[i].min-5);bounds.push(Infinity);}
 const cols=bounds.map(()=>({}));
 items.forEach(it=>{
  let c=0;while(c<bounds.length-1&&it.x>=bounds[c])c++;
  const y=Math.round(it.y/3)*3;
  (cols[c][y]=cols[c][y]||[]).push(it);});
 const out=[];
 cols.forEach(col=>{Object.keys(col).map(Number).sort((a,b)=>b-a).forEach(y=>{out.push(col[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim());});});
 return out;
}
function parseLinhasFatura(linhas){
 // ano de referência: data de vencimento/emissão da fatura
 let ref=null,venc=null;
 for(const l of linhas){const m=l.match(/Vencimento\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);if(m){ref={m:+m[2],y:+m[3]};venc=`${m[3]}-${m[2]}`;break;}}
 if(!ref)for(const l of linhas){const m=l.match(/Emiss[aã]o\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/i);if(m){ref={m:+m[2],y:+m[3]};break;}}
 if(!ref){const h=new Date();ref={m:h.getMonth()+1,y:h.getFullYear()};}
 const regs=[];let capturar=true;
 const reTrans=/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.+?)\s+(-\s?)?((?:R\$\s?)?\d{1,3}(?:\.\d{3})*,\d{2})\s*(D|C)?$/;
 const reOff=/pr[oó]ximas faturas|compras parceladas|limites? de cr[eé]dito|encargos cobrados|simula[cç][aã]o|lan[cç]amentos futuros/i;
 const reOn=/^lan[cç]amentos\s*:|^movimenta|^extrato/i;
 for(const l of linhas){
  if(reOff.test(l)){capturar=false;continue;}
  if(reOn.test(l)){capturar=true;continue;}
  if(!capturar)continue;
  const m=l.match(reTrans);if(!m)continue;
  let[,dd,mm,yy,desc,neg,val,dc]=m;
  if(/SALDO|TOTAL|LIMITE|PAGAMENTO|PAGTO|D[EÉ]BITO AUTOM/i.test(desc))continue;
  let v=parseValorBR(val.replace(/R\$\s?/,''));if(v===null||v===0)continue;
  if(neg||dc==='C')v=-Math.abs(v);
  const y=yy?(yy.length===2?'20'+yy:yy):String(+mm>ref.m?ref.y-1:ref.y);
  // estorno/crédito entra como valor negativo na mesma categoria de despesa
  regs.push({data:`${y}-${mm}-${dd}`,descricao:desc.trim(),valor:v,tipo:'despesa'});
 }
 if(!regs.length)throw new Error('Não encontrei lançamentos no PDF — o layout pode não ser suportado. Tente exportar OFX ou CSV.');
 if(venc)regs.forEach(r=>r._venc=venc);
 return regs;
}

const normKey=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const MES_ABREV={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};
const tituloCase=s=>String(s||'').toLowerCase().replace(/(^|[\s\/])\S/g,c=>c.toUpperCase());
function parseCompRealizado(compCell,mesCell,anoCell,dataISO){
 const ano=parseInt(String(anoCell||'').trim(),10),mes=parseInt(String(mesCell||'').trim(),10);
 if(ano>=2000&&mes>=1&&mes<=12)return `${ano}-${String(mes).padStart(2,'0')}`;
 const c=String(compCell||'').trim();
 let m=c.match(/^(\d{1,2})\/(\d{4})$/);if(m)return `${m[2]}-${m[1].padStart(2,'0')}`;
 m=c.match(/^(\d{4})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}`;
 m=c.match(/^([A-Za-zçÇãéêíóôúÁÉ]{3,})\/(\d{2,4})$/);
 if(m){const mm=MES_ABREV[normKey(m[1]).slice(0,3)];if(mm){let y=m[2];if(y.length===2)y='20'+y;return `${y}-${String(mm).padStart(2,'0')}`;}}
 return dataISO?dataISO.slice(0,7):null;
}
function parseDataRealizado(cell,comp){
 const iso=parseDataBR(cell);if(iso)return iso;
 const m=String(cell||'').trim().match(/^(\d{1,2})[\/.\-](\d{1,2})$/);
 if(m&&comp)return `${comp.slice(0,4)}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
 return comp?comp+'-01':null;
}

function diffDias(a,b){return Math.abs((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);}
function acharAnotacao(t){
 let melhor=null,ms=Infinity;
 (state.anotacoes||[]).forEach(a=>{
  if(a.usadaEm)return;
  if(Math.abs(a.valor-Math.abs(t.valor))>0.005)return;
  if(a.fonte&&t.fonte&&a.fonte!==t.fonte)return; // fonte declarada precisa bater
  const d=diffDias(a.data,t.data);
  if(d>5)return;
  const s=d+((a.fonte&&t.fonte&&a.fonte===t.fonte)?0:10); // mesma fonte vence o desempate
  if(s<ms){ms=s;melhor=a;}});
 return melhor;
}
function ouvirVoz(cb,st){

 if(!SR)return st('<span class="neg">Voz não suportada neste navegador — use Chrome (Android) ou Safari (iPhone).</span>');
 const r=new SR();r.lang='pt-BR';r.interimResults=false;
 st('🎤 Ouvindo… diga por ex.: “45 e 90 padaria são joaquim, padaria”');
 r.onresult=e=>cb(e.results[0][0].transcript);
 r.onerror=e=>st('<span class="neg">Microfone: '+e.error+'</span>');
 r.start();
}
function parseFala(txt){
 const t=' '+txt.toLowerCase()+' ';
 let valor=null,usado='';
 let m=t.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:reais|real|conto[s]?)?(?:\s*e\s*(\d{1,2})\s*(?:centavos)?)?/);
 if(m&&m[1]){valor=parseFloat(m[1].replace(',','.'));if(m[2]&&!m[1].includes(',')&&!m[1].includes('.'))valor+=+m[2]/100;usado=m[0];}
 let categoria='';
 for(const c of state.categorias){const n=c.nome.toLowerCase();if(t.includes(' '+n+' ')||t.trim().endsWith(n)){categoria=c.nome;break;}}
 let resto=t;
 if(usado)resto=resto.replace(usado,' ');
 if(categoria)resto=resto.replace(categoria.toLowerCase(),' ');
 resto=resto.replace(/\b(reais|real|centavos|conto|gastei|paguei|comprei|lançar|lança|no|na|em|de|do|da|com)\b/g,' ').replace(/[,.;]/g,' ').replace(/\s+/g,' ').trim();
 const desc=resto?resto.replace(/^\w/,c=>c.toUpperCase()):'';
 return {valor,categoria,desc};
}
function carregarScript(url){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${url}"]`))return res();const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('falha ao carregar '+url));document.head.appendChild(s);});}
function carregarImagem(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=URL.createObjectURL(file);});}
async function lerNota(file,st,fill){
 try{
  st('🔍 Procurando QR code na imagem…');
  const img=await carregarImagem(file);
  const max=1600,esc_=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*esc_);cv.height=Math.round(img.height*esc_);
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
  let qr=null;
  if(window.jsQR){const d=ctx.getImageData(0,0,cv.width,cv.height);qr=jsQR(d.data,cv.width,cv.height);}
  if(qr&&qr.data){const r=parseNfceQR(qr.data);
   if(r){st('<span class="pos">✅ QR da nota lido'+(r.valor?' — R$ '+String(r.valor.toFixed(2)).replace('.',',') :'')+'</span> — confira e complete');fill(r);return;}}
  st('QR não encontrado — lendo o texto da foto (pode levar ~20s na 1ª vez)…');
  await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js');
  const worker=await Tesseract.createWorker('por');
  const {data:{text}}=await worker.recognize(cv);
  await worker.terminate();
  const r=parseTextoNota(text);
  st(r.valor?'<span class="pos">✅ Texto lido</span> — confira os campos':'<span class="neg">⚠ Não identifiquei o total — preencha manualmente</span>');
  fill(r);
 }catch(e){st('<span class="neg">Erro ao ler a imagem: '+esc(e.message)+'</span>');}
}
function parseNfceQR(s){
 try{
  const p=(s.includes('?')?new URLSearchParams(s.split('?')[1]).get('p'):null)||s;
  const partes=decodeURIComponent(p).split('|');
  const chave=partes.find(x=>/^\d{44}$/.test(x));
  const vNF=partes.find(x=>/^\d+\.\d{2}$/.test(x));
  if(!chave&&!vNF)return null;
  let data=null;
  const dh=partes.find(x=>/^\d{4}-\d{2}-\d{2}T/.test(x));
  if(dh)data=dh.slice(0,10);
  else if(chave)data=`20${chave.slice(2,4)}-${chave.slice(4,6)}-`+hojeISO().slice(8,10);
  return {valor:vNF?parseFloat(vNF):null,desc:'Cupom fiscal',data,categoria:''};
 }catch(e){return null;}
}
function parseTextoNota(txt){
 let valor=null;
 const mt=txt.match(/(?:valor\s+)?total[^\d\n]{0,12}(\d{1,3}(?:\.\d{3})*,\d{2})/i);
 if(mt)valor=parseValorBR(mt[1]);
 if(valor===null){let max=0;(txt.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g)||[]).forEach(x=>{const v=parseValorBR(x);if(v>max)max=v;});if(max)valor=max;}
 const lin=txt.split('\n').map(l=>l.trim()).filter(l=>l.length>5&&/[A-Za-z]{4}/.test(l)&&!/total|cnpj|cpf|cupom|fiscal|extrato/i.test(l));
 return {valor,desc:(lin[0]||'').slice(0,40),categoria:''};
}

  driveFileId=(await r.json()).id;
 }
 driveStatus('sincronizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
}
function driveAgendarSalvar(){if(!driveToken)return;clearTimeout(driveTimer);driveTimer=setTimeout(()=>{driveSalvarAgora().catch(e=>driveStatus('erro: '+e.message));},2500);}
function mesclarEstados(remoto){
 if(!remoto||!remoto.transacoes)return 0;
 let n=0;
 const ids=new Set(state.transacoes.map(t=>t.id));
 remoto.transacoes.forEach(t=>{if(!ids.has(t.id)){state.transacoes.push(t);n++;}});
 state.regras=Object.assign({},remoto.regras||{},state.regras);
 Object.entries(remoto.orcamento||{}).forEach(([ano,cats])=>{
  if(!state.orcamento[ano])state.orcamento[ano]=cats;
  else Object.entries(cats).forEach(([c,v])=>{if(!state.orcamento[ano][c])state.orcamento[ano][c]=v;});});
 if(!state.saldos)state.saldos={};
 Object.entries(remoto.saldos||{}).forEach(([m,cs])=>{if(!state.saldos[m])state.saldos[m]=cs;else Object.entries(cs).forEach(([c,v])=>{if(state.saldos[m][c]===undefined)state.saldos[m][c]=v;});});
 if(!state.anotacoes)state.anotacoes=[];
 const aids=new Set(state.anotacoes.map(a=>a.id));
 (remoto.anotacoes||[]).forEach(a=>{if(!aids.has(a.id))state.anotacoes.push(a);});
 (remoto.categorias||[]).forEach(c=>{if(!catPorNome(c.nome))state.categorias.push(c);});
 (remoto.contas||[]).forEach(c=>{if(!state.contas.includes(c))state.contas.push(c);});
 return n;
}
async function driveSincronizar(interativo){
 if(!state.driveClientId){if(interativo)toast('Configure o Client ID do Google em Configurações.');return;}
 try{
  driveStatus('conectando…');
  if(!driveToken){const ok=await driveConectar(interativo);if(!ok){driveStatus(interativo?'falha na conexão':'clique para conectar');return;}}
  driveStatus('baixando…');
  const remoto=await driveCarregar();
  const n=mesclarEstados(remoto);
  if(n)toast(n+' lançamento(s) recebido(s) de outro aparelho.');
  try{localStorage.setItem('orcFamiliar',JSON.stringify(state));}catch(e){}
  salvarTimestamp();TABS[tabAtiva]();
  await driveSalvarAgora();
 }catch(e){driveStatus('erro: '+e.message);}
}
/* ================= CONFIGURAÇÕES ================= */
function renderConfig(){
 const nRegras=Object.keys(state.regras).length;
 let h=`<div class="cfg-grid">
 <div class="card"><h2>Família</h2><div class="row"><input id="cfgFam" value="${esc(state.familia)}" class="flex1"><button class="btn ghost" id="cfgFamOk">Salvar</button></div></div>
 <div class="card"><h2>Sincronização Google Drive <span class="tag info" id="cfgDriveTag">${state.driveClientId?'configurado':'não configurado'}</span></h2>
  <p class="muted-sm" style="margin-bottom:10px">Sincroniza os dados entre aparelhos usando um arquivo no Google Drive de quem conecta — cada família vê apenas os próprios dados. O Client ID já vem preenchido; basta conectar. (Para usar outra credencial, edite abaixo.)</p>
  <div class="row"><input id="cfgClientId" class="flex1" placeholder="xxxxx.apps.googleusercontent.com" value="${esc(state.driveClientId)}"><button class="btn ghost" id="cfgClientIdOk">Salvar</button><button class="btn" id="cfgDriveSync">☁ Conectar e sincronizar</button></div></div>
 <div class="card"><h2>Backup dos dados</h2>
  <p class="muted-sm" style="margin-bottom:10px">Os dados ficam salvos neste navegador. Exporte um arquivo .json regularmente como cópia de segurança — e use-o para compartilhar com a família ou abrir em outro computador.</p>
  <div class="row"><button class="btn" id="cfgExp">⬇ Exportar backup (.json)</button><button class="btn sec" id="cfgImp">⬆ Restaurar backup</button><button class="btn sec" id="cfgCSV">⬇ Lançamentos (.csv)</button></div></div>
 <div class="card"><h2>Contas e cartões (fontes)</h2><div id="cfgContas">${state.contas.map((c,i)=>`<div class="li-row"><span class="flex1">${esc(c)}</span><button class="mini" data-delconta="${i}">🗑</button></div>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input id="cfgNovaConta" placeholder="Nova conta/cartão" class="flex1"><button class="btn ghost" id="cfgAddConta">+ Adicionar</button></div></div>
 <div class="card"><h2>Regras de categorização <span class="tag info">${nRegras}</span></h2>
  <p class="muted-sm" style="margin-bottom:8px">Criadas automaticamente quando você categoriza um lançamento. Aplicadas em toda importação.</p>
  <div style="max-height:240px;overflow:auto">${Object.entries(state.regras).sort().map(([k,v])=>`<div class="li-row"><span class="flex1" style="font-size:12px">${esc(k.slice(0,38))}</span><span class="tag ok">${esc(v)}</span><button class="mini" data-delregra="${esc(k)}">🗑</button></div>`).join('')||'<span class="muted-sm">Nenhuma regra ainda.</span>'}</div></div>
 </div>
 <div class="card"><h2>Categorias do orçamento</h2>
  <p class="muted-sm" style="margin-bottom:10px">Estrutura importada do seu modelo Excel. Grupos organizam o painel; as linhas recebem orçamento e lançamentos.</p>
  <div class="cfg-grid">${grupos().map(g=>`<div><b>${esc(g.nome)}</b> <span class="tag ${g.tipo==='receita'?'ok':g.tipo==='transferencia'?'info':'warn'}">${g.tipo}</span>
   ${g.itens.map(c=>`<div class="li-row"><span class="flex1">${esc(c.nome)}</span><button class="mini" data-delcat="${esc(c.nome)}">🗑</button></div>`).join('')}
   <div class="row" style="margin-top:6px"><input data-novacat="${esc(g.nome)}" placeholder="Nova linha" class="flex1" style="font-size:12px"><button class="mini" data-addcat="${esc(g.nome)}">＋</button></div></div>`).join('')}</div>
  <div class="row" style="margin-top:14px"><input id="cfgNovoGrupo" placeholder="Novo grupo"><select id="cfgNovoGrupoTipo"><option value="despesa">despesa</option><option value="receita">receita</option></select><button class="btn ghost" id="cfgAddGrupo">+ Criar grupo</button></div></div>
 <div class="card"><h2>Zona de risco</h2><div class="row"><button class="btn danger" id="cfgLimparTrans">Apagar todos os lançamentos</button><button class="btn danger" id="cfgReset">Reiniciar tudo</button></div></div>`;
 const el=document.getElementById('tab-config');el.innerHTML=h;
 el.querySelector('#cfgFamOk').onclick=()=>{state.familia=el.querySelector('#cfgFam').value;rerender();toast('Salvo.');};
 el.querySelector('#cfgClientIdOk').onclick=()=>{state.driveClientId=el.querySelector('#cfgClientId').value.trim();rerender();toast(state.driveClientId?'Client ID salvo.':'Client ID removido.');};
 el.querySelector('#cfgDriveSync').onclick=()=>driveSincronizar(true);
 el.querySelector('#cfgExp').onclick=exportarBackup;
 el.querySelector('#cfgImp').onclick=importarBackup;
 el.querySelector('#cfgCSV').onclick=exportarCSV;
 el.querySelector('#cfgAddConta').onclick=()=>{const v=el.querySelector('#cfgNovaConta').value.trim();if(v&&!state.contas.includes(v)){state.contas.push(v);rerender();}};
 el.querySelectorAll('button[data-delconta]').forEach(b=>{b.onclick=()=>{state.contas.splice(+b.dataset.delconta,1);rerender();};});
 el.querySelectorAll('button[data-delregra]').forEach(b=>{b.onclick=()=>{delete state.regras[b.dataset.delregra];rerender();};});
 el.querySelectorAll('button[data-delcat]').forEach(b=>{b.onclick=()=>{const n=b.dataset.delcat;const usos=state.transacoes.filter(t=>t.categoria===n).length;if(!confirm(`Excluir a linha "${n}"?`+(usos?` ${usos} lançamento(s) ficarão sem categoria.`:'')))return;state.categorias=state.categorias.filter(c=>c.nome!==n);state.transacoes.forEach(t=>{if(t.categoria===n)t.categoria=null;});rerender();};});
 el.querySelectorAll('button[data-addcat]').forEach(b=>{b.onclick=()=>{const inp=el.querySelector(`input[data-novacat="${CSS.escape(b.dataset.addcat)}"]`);const v=inp.value.trim();if(!v)return;if(catPorNome(v))return toast('Já existe uma linha com esse nome.');const g=grupos().find(x=>x.nome===b.dataset.addcat);state.categorias.push({grupo:g.nome,nome:v,tipo:g.tipo});rerender();};});
 el.querySelector('#cfgAddGrupo').onclick=()=>{const v=el.querySelector('#cfgNovoGrupo').value.trim();const t=el.querySelector('#cfgNovoGrupoTipo').value;if(!v)return;state.categorias.push({grupo:v,nome:v+' - Geral',tipo:t});rerender();};
 el.querySelector('#cfgLimparTrans').onclick=()=>{if(confirm('Apagar TODOS os lançamentos? O orçamento será mantido.')){state.transacoes=[];rerender();}};
 el.querySelector('#cfgReset').onclick=()=>{if(confirm('Apagar TUDO e voltar ao estado inicial?')&&confirm('Tem certeza? Exporte um backup antes!')){state=novoEstado();rerender();}};
}
function download(nome,conteudo,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
function exportarBackup(){download(`orcamento-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,1),'application/json');toast('Backup exportado.');}
function importarBackup(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const s=JSON.parse(await i.files[0].text());if(!s.categorias||!s.transacoes)throw new Error('formato inválido');state=s;if(!state.regras)state.regras={};rerender();toast('Backup restaurado.');}catch(e){toast('Erro: '+e.message);}};i.click();}
function exportarCSV(){const sep=';';let csv='﻿Data;Competencia;Fonte;Descricao;Valor;Tipo;Grupo;Categoria;Observacoes\n';
 state.transacoes.sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>{const c=catPorNome(t.categoria||'');
  csv+=[t.data.split('-').reverse().join('/'),t.comp,t.fonte,'"'+t.descricao.replace(/"/g,'""')+'"',String(t.valor.toFixed(2)).replace('.',','),c?.tipo||t.tipo,c?.grupo||'',t.categoria||'','"'+String(t.obs||'').replace(/"/g,'""')+'"'].join(sep)+'\n';});
 download('lancamentos.csv',csv,'text/csv');toast('CSV exportado.');}
/* ================= INIT ================= */
carregar();salvarTimestamp();renderPainel();
document.getElementById('driveStatus').onclick=()=>driveSincronizar(true);
if(state.driveClientId){driveStatus('clique para conectar');driveSincronizar(false);}
window.addEventListener('beforeunload',salvar);
</script>
